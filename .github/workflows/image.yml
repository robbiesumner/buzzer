name: Image

on:
  workflow_call:
    inputs:
      publish:
        description: Push to GHCR. False on pull requests, which build and smoke test only.
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: buzzer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name buzzer-smoke -p 8000:8000 \
            -e GM_PASSWORD=ci-password \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            buzzer:smoke

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && break
            sleep 1
          done

          echo "health:   $(curl -fsS http://localhost:8000/api/health)"
          curl -fsS -o /dev/null http://localhost:8000/
          echo "spa:      served"

          code=$(curl -fsS -X POST http://localhost:8000/api/gm/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-password"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          echo "room:     $code"

          for _ in $(seq 1 30); do
            status=$(docker inspect buzzer-smoke --format '{{.State.Health.Status}}')
            [ "$status" = starting ] || break
            sleep 1
          done
          echo "probe:    $status"
          test "$status" = healthy

      - name: Server log
        if: always()
        run: docker logs buzzer-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f buzzer-smoke || true

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: inputs.publish
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Tags pushed:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
